name = "liftosaur-strava-sync"
main = "src/cloudflare_worker.py"
compatibility_date = "2026-10-29"
compatibility_flags = ["python_workers"]
# Only reachable through the Cloudflare Access-protected custom domain.
workers_dev = false
preview_urls = false

# The React app in web/ (npm run build). The Worker runs first for every
# request so Access is verified before any asset is served.
[assets]
directory = "web/dist"
binding = "ASSETS"
run_worker_first = true
# /connect has no file of its own; serve index.html and let the app pick the page.
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "STRAVA_TOKEN_STORE"
id = "6fad49e40aaa4209acd8423973969a2b"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[[d1_databases]]
binding = "liftosaur_strava_sync_users"
database_name = "liftosaur-strava-sync-users"
database_id = "88b7942e-5e55-46ea-9ca3-9a4b130ad215"

[vars]
CF_ACCESS_TEAM_DOMAIN = "https://lively-river-44e6.cloudflareaccess.com"
CF_ACCESS_AUD = "278afb75cefdaba44ebe4230310d00191fc5ae625f05ed0f682f7c898ac948b6"

[access.dev]
aud = "local-dev-aud"

[access.dev.identity]
email = "test@example.com"

[[previews.kv_namespaces]]
binding = "STRAVA_TOKEN_STORE"
id = "6fad49e40aaa4209acd8423973969a2b"

[[previews.d1_databases]]
binding = "liftosaur_strava_sync_users"
database_name = "liftosaur-strava-sync-preview"
database_id = "5c172b23-2571-4b43-86c6-84280c6388b3"

[previews.vars]
CF_ACCESS_TEAM_DOMAIN = "https://lively-river-44e6.cloudflareaccess.com"
CF_ACCESS_AUD = "278afb75cefdaba44ebe4230310d00191fc5ae625f05ed0f682f7c898ac948b6"

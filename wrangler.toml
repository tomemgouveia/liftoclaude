name = "liftosaur-strava-sync"
main = "src/cloudflare_worker.py"
compatibility_date = "2026-10-29"
compatibility_flags = ["python_workers"]

[[kv_namespaces]]
binding = "STRAVA_TOKEN_STORE"
id = "6fad49e40aaa4209acd8423973969a2b"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[[d1_databases]]
binding = "liftostrava_users_db"
database_name = "liftosaur-strava-sync-users"
database_id = "acce9e70-4874-41bb-bf9c-548c3876ef0c"

[vars]
CF_ACCESS_TEAM_DOMAIN = "lively-river-44e6.cloudflareaccess.com"
